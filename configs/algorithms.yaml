# Registry of everything RoboticsCore implements. It is the single source for the status
# matrix in README.md. Regenerate the matrix with
#   python scripts/docs/generate_status.py
# and check that it is current, and that every referenced file exists, with
#   python scripts/docs/generate_status.py --check
#
# status:
#   Tested        implemented, covered by unit tests, documented
#   Experimental  implemented, but validated only in a limited setting (see notes)
#   Planned       not implemented yet
# demo:      name of a `roboticscore_demo` scenario (and docs/assets/<demo>.gif), or null
# benchmark: "scenario" = measured by roboticscore_bench, "micro" = Google Benchmark, or null

categories:
  - id: math
    title: Math and geometry
  - id: models
    title: Motion models
  - id: estimation
    title: State estimation
  - id: mapping
    title: Mapping and registration
  - id: slam
    title: SLAM
  - id: planning
    title: Planning
  - id: trajectory
    title: Trajectories and optimisation
  - id: control
    title: Control
  - id: integration
    title: Simulation and integration

